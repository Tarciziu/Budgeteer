# SonarCloud project configuration used by .github/workflows/sonar-scan.yml
# Fill in the two values below from your SonarCloud project (Administration > General Settings).
sonar.projectKey=CHANGE_ME
sonar.organization=CHANGE_ME

sonar.sources=.
sonar.tests=BudgeteerTests,Modules/Core/CoreTests,Modules/CoreUI/CoreUITests,Modules/CustomerExperience/CustomerExperienceTests,Modules/BusinessCore/BusinessCoreTests,Modules/Authentication/AuthenticationTests,CustomPackages/AppTestingGround/Tests

sonar.exclusions=**/*.xcodeproj/**\
,**/*.xcworkspace/**,\
**/DerivedData/**,\
**/build/**,\
**/build_wrapper_output_directory/**,\
*/*DM.swift,\
*/*Coordinator.swift,\
*/*Screen.swift,\
*/*View.swift,\
*/*UIModel.swift


# Populated by the "Convert coverage to SonarQube generic format" workflow step.
sonar.coverageReportPaths=sonarqube-generic-coverage.xml
