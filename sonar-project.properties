# SonarCloud project configuration used by .github/workflows/sonar-scan.yml
# Fill in the two values below from your SonarCloud project (Administration > General Settings).
sonar.projectKey=Tarciziu_Budgeteer
sonar.organization=code4fun

sonar.coverageReportPaths=sonarqube-generic-coverage.xml

# Exclude C, C++ and Objective-C from scan, otherwise Sonar will throw an error
sonar.c.file.suffixes=-
sonar.cpp.file.suffixes=-
sonar.objc.file.suffixes=-

sonar.sources=.
sonar.tests=BudgeteerTests,Modules/Core/CoreTests,Modules/CoreUI/CoreUITests,Modules/CustomerExperience/CustomerExperienceTests,Modules/BusinessCore/BusinessCoreTests,Modules/Authentication/AuthenticationTests,CustomPackages/AppTestingGround/Tests

# Fine-tuning to exclude files which should not be part of the reports
sonar.exclusions=**/*.xcodeproj/**,\
**/*.xcworkspace/**,\
.github/workflows/*,\
**/*Tests/**/*,\
**/DerivedData/**,\
**/build/**,\
**/build_wrapper_output_directory/**,\
*/*DM.swift,\
*/*Coordinator.swift,\
*/*Screen.swift,\
*/*View.swift,\
*/*UIModel.swift,\
**/DeveloperOptions/**/*.*,\
BudgeteerTests/**,\
Modules/Core/CoreTests/**,\
Modules/CoreUI/CoreUITests/**,\
Modules/CustomerExperience/CustomerExperienceTests/**,\
Modules/BusinessCore/BusinessCoreTests/**,\
Modules/Authentication/AuthenticationTests/**,\
CustomPackages/AppTestingGround/Tests/**
